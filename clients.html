<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clients · Centoro Admin</title>
<script>
/* ===== THEME PRE-LOADER — Eliminates theme flash on page change ===== */
(function() {
  try {
    var raw = localStorage.getItem('centoro_admin_db_v7');
    if (!raw) return;
    var db = JSON.parse(raw);
    var t = (db.settings && db.settings.theme) || {};

    function isLight(hex) {
      try {
        var c = String(hex).replace('#', '').trim();
        if (c.length === 3) c = c.split('').map(function(x) { return x + x; }).join('');
        var r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
        if (isNaN(r) || isNaN(g) || isNaN(b)) return false;
        return (0.299 * r + 0.587 * g + 0.114 * b) > 160;
      } catch (e) { return false; }
    }

    var root = document.documentElement;

    if (t.primary) root.style.setProperty('--primary', t.primary);
    if (t.primaryDark) root.style.setProperty('--primary-dark', t.primaryDark);
    if (t.primaryLight) root.style.setProperty('--primary-light', t.primaryLight);
    if (t.accent) root.style.setProperty('--accent', t.accent);
    if (t.bgBase) root.style.setProperty('--bg-base', t.bgBase);
    if (t.bgSurface) root.style.setProperty('--bg-surface', t.bgSurface);

    if (t.bgBase && isLight(t.bgBase)) {
      root.style.setProperty('--bg-elevated', t.bgElevated || '#f8fafc');
      root.style.setProperty('--bg-input', t.bgInput || '#f8fafc');
      root.style.setProperty('--border', t.border || '#e2e8f0');
      root.style.setProperty('--text-primary', t.textPrimary || '#0f172a');
      root.style.setProperty('--text-secondary', t.textSecondary || '#475569');
      root.style.setProperty('--text-muted', t.textMuted || '#94a3b8');
    } else {
      root.style.removeProperty('--bg-elevated');
      root.style.removeProperty('--bg-input');
      root.style.removeProperty('--border');
      root.style.removeProperty('--text-primary');
      root.style.removeProperty('--text-secondary');
      root.style.removeProperty('--text-muted');
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="clients.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>
<style>
  .filter-bar { margin-bottom: 16px; max-width: 350px; }
  .filter-bar input {
    width: 100%; padding: 10px 12px; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text-primary); font-size: 0.9rem;
  }
  .filter-bar input:focus { outline: none; border-color: var(--primary); }

  .service-chip {
    display: inline-block;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: .8rem;
    margin: 0 6px 6px 0;
    cursor: pointer;
    color: var(--text-secondary);
  }
  .service-chip.active {
    background: var(--primary);
    color: #0f172a;
    border-color: var(--primary);
    font-weight: 700;
  }

  .collapse-indicator {
    font-size: .8rem;
    color: var(--text-muted);
  }
</style>
</head>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand"><span class="dot"></span><span class="name">Centoro</span><span class="suffix">.</span></div>
      <button class="sidebar-collapse" id="collapse-btn"><i data-feather="chevron-left"></i></button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-user" id="sidebar-user"></div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left"><h1 class="topbar-title" id="topbar-title">Clients</h1></div>
      <div class="topbar-right">

<script src="clients.js"></script>
<script>
  initApp('clients.html', 'Clients');

  if (!DB.clients) DB.clients = [];
  if (!DB.projects) DB.projects = [];
  if (!DB.invoices) DB.invoices = [];
  if (!DB.services) DB.services = [];

  function toggleCard(bodyId, header) {
    const body = document.getElementById(bodyId);
    const indicator = header.querySelector('.collapse-indicator');

    if (body.style.display === 'none') {
      body.style.display = 'block';
      if (indicator) indicator.textContent = '▾';
    } else {
      body.style.display = 'none';
      if (indicator) indicator.textContent = '▸';
    }
  }

  function esc(str) {
    return String(str || '').replace(/"/g, '&quot;');
  }

  function escapeRegExp(str) {
    return String(str || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function getServiceList() {
    const set = new Set();

    (DB.services || []).forEach(s => {
      if (s.name) set.add(s.name);
    });

    (DB.projects || []).forEach(p => {
      if (p.service) set.add(p.service);
    });

    (DB.invoices || []).forEach(i => {
      if (i.service) set.add(i.service);

      (i.items || []).forEach(it => {
        if (it.description) set.add(it.description);
      });
    });

    return [...set].filter(Boolean).sort((a, b) => a.localeCompare(b));
  }

  function populateClientFilters() {
    const serviceSel = document.getElementById('filter-service');
    const currentService = serviceSel.value;

    const services = getServiceList();

    serviceSel.innerHTML = '<option value="">All Services</option>' + services.map(s => `<option value="${esc(s)}">${s}</option>`).join('');

    if (currentService) serviceSel.value = currentService;
  }

  function clientUsesService(clientId, service) {
    const projectMatch = DB.projects.some(p => p.clientId === clientId && p.service === service);

    const invoiceMatch = DB.invoices.some(i => {
      if (i.clientId !== clientId) return false;

      if (i.service === service) return true;

      return (i.items || []).some(it => it.description === service);
    });

    return projectMatch || invoiceMatch;
  }

  function getServiceClientCounts() {
    const counts = {};

    DB.clients.forEach(c => {
      const used = new Set();

      DB.projects.forEach(p => {
        if (p.clientId === c.id && p.service) used.add(p.service);
      });

      DB.invoices.forEach(i => {
        if (i.clientId !== c.id) return;

        if (i.service) used.add(i.service);

        (i.items || []).forEach(it => {
          if (it.description) used.add(it.description);
        });
      });

      used.forEach(s => {
        counts[s] = (counts[s] || 0) + 1;
      });
    });

    return counts;
  }

  function renderServiceChips() {
    const current = document.getElementById('filter-service').value;
    const services = getServiceList();
    const counts = getServiceClientCounts();

    let html = `<span class="service-chip ${current === '' ? 'active' : ''}" onclick="setClientServiceFilter('')">All</span>`;

    services.forEach(s => {
      html += `<span class="service-chip ${current === s ? 'active' : ''}" data-service="${esc(s)}" onclick="setClientServiceFilter(this.getAttribute('data-service'))">${s} (${counts[s] || 0})</span>`;
    });

    document.getElementById('service-chips').innerHTML = html;
  }

  function setClientServiceFilter(value) {
    document.getElementById('filter-service').value = value;
    renderClients();
  }

  function clearClientFilters() {
    document.getElementById('client-search').value = '';
    document.getElementById('filter-status').value = '';
    document.getElementById('filter-service').value = '';
    document.getElementById('client-sort').value = 'name-asc';
    renderClients();
  }

  function getFilteredClients() {
    const rawSearch = document.getElementById('client-search').value || '';
    const q = rawSearch.toLowerCase().replace(/#/g, '').trim();
    const qCompact = q.replace(/\s+/g, '');

    const status = document.getElementById('filter-status').value;
    const service = document.getElementById('filter-service').value;
    const sort = document.getElementById('client-sort').value;

    let list = DB.clients.filter(c => {
      const code = String(c.code || '').toUpperCase();

      const searchParts = [
        '#' + code,
        code,
        c.name,
        c.firstName,
        c.middleName,
        c.surname,
        c.initials,
        c.email,
        c.phone,
        c.address,
        c.website,
        c.companyName,
        c.companyCK,
        c.idNumber
      ].join(' ').toLowerCase();

      const searchCompact = searchParts.replace(/\s+/g, '');

      if (q && !searchParts.includes(q) && !searchCompact.includes(qCompact)) return false;
      if (status && c.status !== status) return false;
      if (service && !clientUsesService(c.id, service)) return false;

      return true;
    });

    list.sort((a, b) => {
      if (sort === 'name-asc') return (a.name || '').localeCompare(b.name || '');
      if (sort === 'spent-desc') return Number(b.totalSpent || 0) - Number(a.totalSpent || 0);
      if (sort === 'projects-desc') return Number(b.projects || 0) - Number(a.projects || 0);
      if (sort === 'code-asc') return (a.code || '').localeCompare(b.code || '');
      return 0;
    });

    return list;
  }

  function renderClients() {
    populateClientFilters();

    const list = getFilteredClients();

    document.getElementById('st-clients').textContent = DB.clients.length;
    document.getElementById('st-active').textContent = DB.clients.filter(c => c.status === 'active').length;
    document.getElementById('st-billed').textContent = fmtZAR(DB.clients.reduce((s, c) => s + (Number(c.totalSpent) || 0), 0));

    document.getElementById('clients-table').innerHTML = list.map(c => `
      <tr>
        <td><strong>#${c.code || '—'}</strong></td>
        <td>
          <strong>${c.name}</strong>
          ${c.companyName ? `<div style="font-size:.75rem;color:var(--text-muted);">Company: ${c.companyName}</div>` : ''}
          ${c.idNumber ? `<div style="font-size:.75rem;color:var(--text-muted);">ID: ${c.idNumber}</div>` : ''}
          ${c.dob ? `<div style="font-size:.75rem;color:var(--text-muted);">DOB: ${fmtDate(c.dob)}</div>` : ''}
          ${c.website ? `<div style="font-size:.75rem;color:var(--text-muted);">${c.website}</div>` : ''}
        </td>
        <td>
          ${c.email || '—'}
          ${c.phone ? `<div style="font-size:.75rem;color:var(--text-muted);">${c.phone}</div>` : ''}
          ${c.address ? `<div style="font-size:.75rem;color:var(--text-muted);">${c.address}</div>` : ''}
        </td>
        <td>${fmtZAR(c.totalSpent || 0)}</td>
        <td>${c.projects || 0}</td>
        <td><span class="badge badge-${c.status === 'active' ? 'success' : 'neutral'}">${c.status}</span></td>
        <td>
          <button class="btn btn-secondary" onclick="editClient('${c.id}')">Edit</button>
          <button class="btn btn-danger" onclick="deleteClient('${c.id}')">✕</button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:20px;">No clients found.</td></tr>';

    renderServiceChips();
    feather.replace();
  }

  function clientCodeBaseFromClient(c) {
    const firstName = c.firstName || '';
    const middleName = c.middleName || '';
    const surname = c.surname || '';
    const companyName = c.companyName || '';
    const fallbackName = c.name || '';

    const personName = [firstName, middleName, surname].filter(Boolean).join(' ').trim();
    const source = personName || companyName || fallbackName;

    if (!source) return 'CL';

    const parts = source.split(/\s+/).filter(Boolean);

    if (parts.length === 1) {
      return parts[0].slice(0, 2).toUpperCase();
    }

    return parts.map(p => p[0].toUpperCase()).join('').slice(0, 3);
  }

  function getClientCodeBaseFromForm() {
    const firstName = document.getElementById('client-first-name').value.trim();
    const middleName = document.getElementById('client-middle-name').value.trim();
    const surname = document.getElementById('client-surname').value.trim();
    const companyName = document.getElementById('client-company-name').value.trim();

    const personName = [firstName, middleName, surname].filter(Boolean).join(' ').trim();
    const source = personName || companyName;

    if (!source) return 'CL';

    const parts = source.split(/\s+/).filter(Boolean);

    if (parts.length === 1) {
      return parts[0].slice(0, 2).toUpperCase();
    }

    return parts.map(p => p[0].toUpperCase()).join('').slice(0, 3);
  }

  function makeUniqueClientCode(base, ignoreId = null) {
    const cleanBase = base.toUpperCase();
    let maxSeq = 0;

    DB.clients.forEach(c => {
      if (c.id === ignoreId) return;

      const code = String(c.code || '').replace(/^#/, '').toUpperCase();

      if (code === cleanBase) {
        maxSeq = Math.max(maxSeq, 1);
        return;
      }

      if (code.startsWith(cleanBase)) {
        const tail = code.slice(cleanBase.length);
        const num = parseInt(tail, 10);

        if (!isNaN(num)) {
          maxSeq = Math.max(maxSeq, num);
        }
      }
    });

    const next = maxSeq + 1;

    return cleanBase + String(next).padStart(2, '0');
  }

  function normalizeClientCodes() {
    let changed = false;

    DB.clients.forEach(c => {
      const current = String(c.code || '').replace(/^#/, '').toUpperCase();
      const base = clientCodeBaseFromClient(c).toUpperCase();

      if (!current) return;

      const match = current.match(new RegExp('^' + escapeRegExp(base) + '(\\d*)$'));

      if (match) {
        const digits = match[1];

        if (digits === '' || digits.length < 2) {
          let seq = digits ? parseInt(digits, 10) : 1;
          let newCode = base + String(seq).padStart(2, '0');

          while (DB.clients.some(o => o.id !== c.id && String(o.code || '').replace(/^#/, '').toUpperCase() === newCode)) {
            seq++;
            newCode = base + String(seq).padStart(2, '0');
          }

          if (newCode !== current) {
            c.code = newCode;
            changed = true;
          }
        }
      }
    });

    DB.clients.forEach(c => {
      if (!c.code) {
        c.code = makeUniqueClientCode(clientCodeBaseFromClient(c), c.id);
        changed = true;
      }
    });

    if (changed) saveDB();
  }

  normalizeClientCodes();

  function updateClientCodePreview() {
    const id = document.getElementById('client-id').value;
    const el = document.getElementById('client-code-preview');

    if (id) {
      const c = DB.clients.find(x => x.id === id);
      el.value = c && c.code ? '#' + c.code : '';
      el.placeholder = '';
      return;
    }

    el.value = '';
    el.placeholder = '#Assigned after saving';
  }

  function openClientModal() {
    document.getElementById('client-form').reset();
    document.getElementById('client-id').value = '';
    updateClientCodePreview();
    document.getElementById('client-modal-title').textContent = 'Add Client';
    document.getElementById('client-modal').classList.add('active');
  }

  function closeClientModal() {
    document.getElementById('client-modal').classList.remove('active');
  }

  function editClient(id) {
    const c = DB.clients.find(x => x.id === id);
    if (!c) return;

    document.getElementById('client-id').value = c.id;
    document.getElementById('client-code-preview').value = c.code ? '#' + c.code : '';
    document.getElementById('client-code-preview').placeholder = '';

    document.getElementById('client-first-name').value = c.firstName || (c.firstName || c.middleName || c.surname ? '' : c.name);
    document.getElementById('client-middle-name').value = c.middleName || '';
    document.getElementById('client-surname').value = c.surname || '';
    document.getElementById('client-initials').value = c.initials || '';
    document.getElementById('client-id-number').value = c.idNumber || '';
    document.getElementById('client-dob').value = c.dob || '';
    document.getElementById('client-email').value = c.email || '';
    document.getElementById('client-phone').value = c.phone || '';
    document.getElementById('client-address').value = c.address || '';
    document.getElementById('client-website').value = c.website || '';
    document.getElementById('client-company-name').value = c.companyName || '';
    document.getElementById('client-company-ck').value = c.companyCK || '';
    document.getElementById('client-status').value = c.status || 'active';

    document.getElementById('client-modal-title').textContent = 'Edit Client';
    document.getElementById('client-modal').classList.add('active');
  }

  async function saveClient() {
    const id = document.getElementById('client-id').value;

    const firstName = document.getElementById('client-first-name').value.trim();
    const middleName = document.getElementById('client-middle-name').value.trim();
    const surname = document.getElementById('client-surname').value.trim();
    const initials = document.getElementById('client-initials').value.trim();
    const idNumber = document.getElementById('client-id-number').value.trim();
    const dob = document.getElementById('client-dob').value;
    const email = document.getElementById('client-email').value.trim();
    const phone = document.getElementById('client-phone').value.trim();
    const address = document.getElementById('client-address').value.trim();
    const website = document.getElementById('client-website').value.trim();
    const companyName = document.getElementById('client-company-name').value.trim();
    const companyCK = document.getElementById('client-company-ck').value.trim();
    const status = document.getElementById('client-status').value;

    const fullName = [firstName, middleName, surname].filter(Boolean).join(' ').trim() || companyName;

    if (!fullName) {
      alert('Please capture at least a client name or company name.');
      return;
    }

    const autoInitials = clientCodeBaseFromClient({
      firstName,
      middleName,
      surname,
      companyName,
      name: fullName
    });

    const data = {
      firstName,
      middleName,
      surname,
      name: fullName,
      initials: initials || autoInitials,
      idNumber,
      dob,
      email,
      phone,
      address,
      website,
      companyName,
      companyCK,
      status
    };

    if (id) {
      const idx = DB.clients.findIndex(c => String(c.id) === String(id));

      if (idx >= 0) {
        const response = await ApiService.updateClient(id, data);
        DB.clients[idx] = response.data || { ...DB.clients[idx], ...data };

        logActivity(`updated client ${fullName}`, 'users', 'info');
      }
    } else {
      data.code = makeUniqueClientCode(getClientCodeBaseFromForm());
      data.totalSpent = 0;
      data.projects = 0;
      const response = await ApiService.createClient(data);
      DB.clients.push(response.data || data);

      logActivity(`added new client ${fullName}`, 'user-plus', 'success');
      alert(`Client saved. System code assigned: #${(response.data || data).code}`);
    }

    saveDB();
    closeClientModal();
    renderClients();
  }

  async function deleteClient(id) {
    if (!confirm('Move this client to the Bin?')) return;

    try {
      await ApiService.deleteClient(id);
      DB.clients = DB.clients.filter(client => String(client.id) !== String(id));
      renderClients();
    } catch (error) {
      alert(error.message || 'Unable to delete client.');
    }
  }

  async function loadClientData() {
    try {
      const results = await Promise.allSettled([
        ApiService.getClients(),
        ApiService.getProjects(),
        ApiService.getInvoices()
      ]);
      DB.clients = results[0].status === 'fulfilled' ? results[0].value.data || [] : [];
      DB.projects = results[1].status === 'fulfilled' ? results[1].value.data || [] : [];
      DB.invoices = results[2].status === 'fulfilled' ? results[2].value.data || [] : [];
      renderClients();
    } catch (error) {
      console.error('Unable to load clients:', error);
      renderClients();
    }
  }

  loadClientData();
  feather.replace();
</script>
</body>
</html>
