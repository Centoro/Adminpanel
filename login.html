<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login · Centoro Admin</title>
<style>
  body { visibility: hidden; }
  
  /* ===== NEW: Password Toggle & Remember Me Styles ===== */
  .password-wrapper { position: relative; }
  .password-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center;
    transition: color 0.2s;
  }
  .password-toggle:hover { color: var(--primary); }
  .remember-me-wrapper {
    display: flex; align-items: center; gap: 8px; margin-bottom: 18px;
    font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; user-select: none;
  }
  .remember-me-wrapper input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer;
  }
</style>
<script>
/* ===== THEME PRE-LOADER — Eliminates theme flash on page change ===== */
(function() {
  try {
    var raw = localStorage.getItem('centoro_admin_db_v7');
    if (!raw) return;
    var db = JSON.parse(raw);
    var t = (db.settings && db.settings.theme) || {};

    function isLight(hex) {
      try {
        var c = String(hex).replace('#', '').trim();
        if (c.length === 3) c = c.split('').map(function(x) { return x + x; }).join('');
        var r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
        if (isNaN(r) || isNaN(g) || isNaN(b)) return false;
        return (0.299 * r + 0.587 * g + 0.114 * b) > 160;
      } catch (e) { return false; }
    }

    var root = document.documentElement;

    if (t.primary) root.style.setProperty('--primary', t.primary);
    if (t.primaryDark) root.style.setProperty('--primary-dark', t.primaryDark);
    if (t.primaryLight) root.style.setProperty('--primary-light', t.primaryLight);
    if (t.accent) root.style.setProperty('--accent', t.accent);
    if (t.bgBase) root.style.setProperty('--bg-base', t.bgBase);
    if (t.bgSurface) root.style.setProperty('--bg-surface', t.bgSurface);

    if (t.bgBase && isLight(t.bgBase)) {
      root.style.setProperty('--bg-elevated', t.bgElevated || '#f8fafc');
      root.style.setProperty('--bg-input', t.bgInput || '#f8fafc');
      root.style.setProperty('--border', t.border || '#e2e8f0');
      root.style.setProperty('--text-primary', t.textPrimary || '#0f172a');
      root.style.setProperty('--text-secondary', t.textSecondary || '#475569');
      root.style.setProperty('--text-muted', t.textMuted || '#94a3b8');
    } else {
      root.style.removeProperty('--bg-elevated');
      root.style.removeProperty('--bg-input');
      root.style.removeProperty('--border');
      root.style.removeProperty('--text-primary');
      root.style.removeProperty('--text-secondary');
      root.style.removeProperty('--text-muted');
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="login.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Added Feather Icons for the eye tool -->
<script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand">Centoro<span>.</span></div>
      <div class="tagline">Enterprise Admin Panel</div>
    </div>
    <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
      <div id="login-credentials">
        <div class="form-group">
          <label>Email or Username</label>
          <!-- Changed to type="text" so it accepts both emails and usernames -->
          <input type="text" id="login-email" placeholder="you@centoro.co.za or username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" placeholder="••••••••" required>
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
              <i data-feather="eye" id="eye-icon"></i>
            </button>
          </div>
        </div>
        
        <!-- NEW: Remember Me Checkbox -->
        <label class="remember-me-wrapper">
          <input type="checkbox" id="remember-me">
          <span>Remember me on this device</span>
        </label>
      </div>
      
      <div id="login-otp-step" class="form-group" style="display:none;">
        <label for="login-otp-code">Verification code</label>
        <input type="text" id="login-otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit code">
        <small id="login-otp-destination" style="display:block;color:#94a3b8;margin-top:6px;"></small>
      </div>
      <div id="login-error" role="alert" aria-live="polite" style="display:none;color:#ef4444;margin-bottom:12px;"></div>
      <button id="login-submit" type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <div class="login-footer">
      Empowering Excellence. Defining Success.<br>
      © 2026 Centoro Enterprise
    </div>
  </div>
</div>
<script src="centoroapi.js"></script>
<script>
let loginChallengeId = null;

// ===== NEW: Load remembered credentials on page load =====
window.addEventListener('DOMContentLoaded', () => {
  const rememberedEmail = localStorage.getItem('centoro_remembered_email');
  const rememberedPassword = localStorage.getItem('centoro_remembered_password');
  const rememberMeCheckbox = document.getElementById('remember-me');
  
  if (rememberedEmail) {
    document.getElementById('login-email').value = rememberedEmail;
    rememberMeCheckbox.checked = true;
  }
  if (rememberedPassword) {
    document.getElementById('login-password').value = rememberedPassword;
  }
  
  // Initialize feather icons
  if (window.feather) feather.replace();
});

// ===== NEW: Toggle Password Visibility =====
function togglePasswordVisibility() {
  const passwordInput = document.getElementById('login-password');
  const eyeIcon = document.getElementById('eye-icon');
  
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    eyeIcon.setAttribute('data-feather', 'eye-off');
  } else {
    passwordInput.type = 'password';
    eyeIcon.setAttribute('data-feather', 'eye');
  }
  if (window.feather) feather.replace();
}

window.handleLogin = async function(e) {
    e.preventDefault();
    const button = document.getElementById('login-submit');
    const errorElement = document.getElementById('login-error');
    errorElement.style.display = 'none';
    button.disabled = true;

    try {
    if (!loginChallengeId) {
      button.textContent = 'Signing in...';
      
      const emailValue = document.getElementById('login-email').value;
      const passwordValue = document.getElementById('login-password').value;
      const rememberMe = document.getElementById('remember-me').checked;
      
      // ===== NEW: Handle Remember Me Logic =====
      if (rememberMe) {
        localStorage.setItem('centoro_remembered_email', emailValue);
        localStorage.setItem('centoro_remembered_password', passwordValue); 
      } else {
        localStorage.removeItem('centoro_remembered_email');
        localStorage.removeItem('centoro_remembered_password');
      }

      const response = await window.ApiService.login(
        emailValue,
        passwordValue,
        'email'
      );

      if (response && response.success && response.data && response.data.token) {
          window.location.replace('index.html');
          return;
      }

      if (!response || !response.success || !response.data || !response.data.challengeId) {
        throw new Error(response && response.message ? response.message : 'Unable to start verification.');
      }
      loginChallengeId = response.data.challengeId;
      document.getElementById('login-credentials').style.display = 'none';
      document.getElementById('login-email').required = false;
      document.getElementById('login-password').required = false;
      document.getElementById('login-otp-step').style.display = 'block';
      document.getElementById('login-otp-code').required = true;
      document.getElementById('login-otp-destination').textContent = 'Code sent by ' + response.data.channel + ' to ' + response.data.destination;
      button.textContent = 'Verify & Sign In';
      button.disabled = false;
      document.getElementById('login-otp-code').focus();
        } else {
      button.textContent = 'Verifying...';
      await window.ApiService.verifyOtp(loginChallengeId, document.getElementById('login-otp-code').value.trim());
      if (!window.ApiService.getToken()) throw new Error('Verification failed. Please try again.');
      window.location.replace('index.html');
        }
    } catch (error) {
        errorElement.textContent = error.message || 'Login failed. Check the API connection and try again.';
        errorElement.style.display = 'block';
        button.disabled = false;
        button.textContent = loginChallengeId ? 'Verify & Sign In' : 'Sign In';
    }
};

  if (window.ApiService && typeof window.ApiService.clearToken === 'function') window.ApiService.clearToken();
  document.body.style.visibility = 'visible';
</script>
</body>
</html>
