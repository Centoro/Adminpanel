<!DOCTYPE html>

<script>
/* ===== THEME PRE-LOADER — Eliminates theme flash on page change ===== */
(function() {
  try {
    var raw = localStorage.getItem('centoro_admin_db_v7');
    if (!raw) return;
    var db = JSON.parse(raw);
    var t = (db.settings && db.settings.theme) || {};

    function isLight(hex) {
      try {
        var c = String(hex).replace('#', '').trim();
        if (c.length === 3) c = c.split('').map(function(x) { return x + x; }).join('');
        var r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
        if (isNaN(r) || isNaN(g) || isNaN(b)) return false;
        return (0.299 * r + 0.587 * g + 0.114 * b) > 160;
      } catch (e) { return false; }
    }

    var root = document.documentElement;

    if (t.primary) root.style.setProperty('--primary', t.primary);
    if (t.primaryDark) root.style.setProperty('--primary-dark', t.primaryDark);
    if (t.primaryLight) root.style.setProperty('--primary-light', t.primaryLight);
    if (t.accent) root.style.setProperty('--accent', t.accent);
    if (t.bgBase) root.style.setProperty('--bg-base', t.bgBase);
    if (t.bgSurface) root.style.setProperty('--bg-surface', t.bgSurface);

    if (t.bgBase && isLight(t.bgBase)) {
      root.style.setProperty('--bg-elevated', t.bgElevated || '#f8fafc');
      root.style.setProperty('--bg-input', t.bgInput || '#f8fafc');
      root.style.setProperty('--border', t.border || '#e2e8f0');
      root.style.setProperty('--text-primary', t.textPrimary || '#0f172a');
      root.style.setProperty('--text-secondary', t.textSecondary || '#475569');
      root.style.setProperty('--text-muted', t.textMuted || '#94a3b8');
    } else {
      root.style.removeProperty('--bg-elevated');
      root.style.removeProperty('--bg-input');
      root.style.removeProperty('--border');
      root.style.removeProperty('--text-primary');
      root.style.removeProperty('--text-secondary');
      root.style.removeProperty('--text-muted');
    }
  } catch (e) {}
})();
</script>

  .collapse-indicator {

  #invoice-paper .ip-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: #999; font-weight: 700; }
  #invoice-paper .ip-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  #invoice-paper .ip-table th { background: #1a1a1a; color: #FFC107; text-align: left; padding: 8px 10px; font-size: 0.7rem; text-transform: uppercase; }
  #invoice-paper .ip-table td { padding: 8px 10px; border-bottom: 1px solid #eee; }
  #invoice-paper .ip-totals { margin-left: auto; width: 280px; }
  #invoice-paper .ip-trow { display: flex; justify-content: space-between; padding: 4px 0; }

  #invoice-paper .ip-trow.total span:last-child { color: #FFC107; }
  #invoice-paper .ip-box { background: #f8f8f8; border: 1px solid #eee; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  #invoice-paper .ip-box h4 { font-size: 0.7rem; text-transform: uppercase; border-bottom: 2px solid #FFC107; padding-bottom: 4px; margin: 0 0 8px; }
  #invoice-paper .ip-thanks { text-align: center; border-top: 3px solid #FFC107; padding-top: 12px; font-weight: 800; }

  @media print {
    body * { visibility: hidden; }
    #invoice-paper, #invoice-paper * { visibility: visible; }
    #invoice-paper { position: absolute; left: 0; top: 0; width: 100%; }
    .modal-header, .modal-footer { display: none !important; }
  }
</style>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-brand"><span class="dot"></span><span class="name">Centoro</span><span class="suffix">.</span></div><button class="sidebar-collapse" id="collapse-btn"><i data-feather="chevron-left"></i></button></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-user" id="sidebar-user"></div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left"><h1 class="topbar-title" id="topbar-title">Invoices</h1></div>
      <div class="topbar-right">
        <button class="icon-btn" id="logout-btn"><i data-feather="log-out"></i></button>
        <div class="user-avatar" id="topbar-avatar">CJ</div>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <div><h1>Invoices</h1><p>Tracking # format: CODE00-DD/MM/YYYY with QR.</p></div>
        <button class="btn btn-primary" onclick="openInvoiceModal()"><i data-feather="plus"></i> New Invoice</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card green"><div class="stat-label">Total Billed</div><div class="stat-value" id="stat-billed">R 0</div></div>
        <div class="stat-card"><div class="stat-label">Paid</div><div class="stat-value" id="stat-paid">R 0</div></div>
        <div class="stat-card red"><div class="stat-label">Outstanding</div><div class="stat-value" id="stat-due">R 0</div></div>
      </div>

      <div class="card">
        <div class="card-header" style="cursor:pointer;" onclick="toggleCard('invoice-filter-body', this)">
          <div class="card-title" style="display:flex;align-items:center;gap:8px;">
            Search, Filter & Sort <span class="collapse-indicator">▾</span>
          </div>
          <button class="btn btn-secondary" onclick="event.stopPropagation(); clearInvoiceFilters()">Clear Filters</button>
        </div>

        <div id="invoice-filter-body">
          <div class="form-grid">
            <div class="form-group" style="grid-column:1/-1;">
              <label>Search</label>
              <input id="inv-search" placeholder="Search invoice #, client, project, service, item... e.g. #UC01-15/07/2026" oninput="renderInvoices()">
            </div>

            <div class="form-group">
              <label>Tracking Number</label>
              <input id="filter-tracking" placeholder="e.g. #UC01-15/07/2026" oninput="renderInvoices()">
            </div>

            <div class="form-group">
              <label>Client</label>
              <select id="filter-client" onchange="renderInvoices()"></select>
            </div>

            <div class="form-group">
              <label>Project</label>
              <select id="filter-project" onchange="renderInvoices()"></select>
            </div>

            <div class="form-group">
              <label>Service</label>
              <select id="filter-service" onchange="renderInvoices()"></select>
            </div>

            <div class="form-group">
              <label>Status</label>
              <select id="filter-status" onchange="renderInvoices()">
                <option value="">All Statuses</option>
                <option value="unpaid">Unpaid</option>
                <option value="partial">Partial</option>
                <option value="paid">Paid</option>
                <option value="overdue">Overdue</option>
              </select>
            </div>

            <div class="form-group">
              <label>Sort By</label>
              <select id="invoice-sort" onchange="renderInvoices()">
                <option value="due-asc" selected>Due Date (earliest first)</option>
                <option value="due-desc">Due Date (latest first)</option>
                <option value="issue-desc">Issue Date (newest first)</option>
                <option value="issue-asc">Issue Date (oldest first)</option>
                <option value="total-desc">Total (high to low)</option>
                <option value="total-asc">Total (low to high)</option>
                <option value="outstanding-desc">Outstanding (high to low)</option>
                <option value="client-asc">Client (A-Z)</option>
                <option value="tracking-asc">Tracking Number (A-Z)</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header" style="cursor:pointer;" onclick="toggleCard('invoice-service-body', this)">
          <div class="card-title" style="display:flex;align-items:center;gap:8px;">

        </div>

        <div id="invoice-service-body">

        </div>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button class="btn btn-secondary" id="view-flat" onclick="setView('flat')">Flat List</button>
        <button class="btn btn-primary" id="view-grouped" onclick="setView('grouped')">Grouped by Client</button>
      </div>

      <div id="flat-view" class="card" style="padding:0;display:none;">
        <table class="data-table">
          <thead><tr><th>Tracking #</th><th>Client</th><th>Issue</th><th>Due</th><th>Total</th><th>Status</th><th></th></tr></thead>
          <tbody id="invoices-table"></tbody>
        </table>
      </div>

      <div id="grouped-view"></div>
    </div>

</div>

      <div class="form-group">

          <div class="form-group" style="margin:0;">

          <div class="form-group" style="margin:0;">

      <div class="form-group">
        <label>Line Items</label>

        <div id="items-rows"></div>

        <div style="display:flex;gap:6px;">
          <select id="service-pick" onchange="addFromService()" style="flex:1;padding:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);">
            <option value="">— Pick from catalog —</option>
          </select>
          <button type="button" class="btn btn-secondary" onclick="addItemRow()">+ Custom</button>
        </div>

        <div class="inline-add" style="margin-top:8px;">
          <input id="new-service-name" placeholder="Log a new service if not listed...">
          <input id="new-service-price" type="number" step="0.01" placeholder="Price" style="flex:0 0 130px;">
          <button type="button" class="btn btn-secondary" onclick="quickAddService()">+ Log Service</button>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group"><label>Discount %</label><input type="number" id="invoice-discount" value="0" oninput="recalcItems()"></div>
        <div class="form-group"><label>VAT %</label><input type="number" id="invoice-vat-rate" value="15" oninput="recalcItems()"></div>
        <div class="form-group"><label>Subtotal</label><input id="invoice-subtotal" readonly></div>
        <div class="form-group"><label>VAT</label><input id="invoice-vat" readonly></div>
        <div class="form-group"><label>Total</label><input id="invoice-total" readonly style="font-weight:700;color:var(--primary);"></div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeM('invoice-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveInvoice()">Generate</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="invoice-view-modal">
  <div class="modal wide">
    <div class="modal-header">
      <div class="modal-title">Invoice Preview</div>
      <button class="modal-close" onclick="closeM('invoice-view-modal')">✕</button>
    </div>

    <div class="modal-body" style="padding:0;">
      <div id="invoice-paper"></div>

      <button class="btn btn-primary" onclick="window.print()"><i data-feather="printer"></i> Print / PDF</button>
    </div>
  </div>
</div>

<script>
  initApp('invoices.html', 'Invoices');

  const COMPANY = {
    provider: 'Mr CH Heideman',
    providerCity: 'Cape Town',
    bank: 'FNB: FIRST BUSINESS ZERO',
    accountName: 'MR CH HEIDEMAN T/A CENTORO',
    accountNo: '63164991044',
    branch: '250655',
    email1: 'centoroenterprise@gmail.com',
    email2: 'cyprianheideman@gmail.com',
    contact: '081 567 9592',
    reg: '2018/567462/07',
    tax: '9908825160',
    services: [
      'Graphic Design (Branding, Posters, Flyers)',
      'Web & App Development',
      'Music Production & Mixing',
      'Studio Recording',
      'Mixing & Mastering',
      'Marketing & Promotions',
      'Video Editing & Photography',
      'Event Coverage'
    ]
  };

  const r = n => 'R' + Number(n || 0).toFixed(2);
  let currentView = 'grouped';

  const DEFAULT_INVOICE_SERVICES = [
    'Graphic Design',
    'Graphic Design (Branding, Posters, Flyers)',
    'Graphic Design (Hourly)',
    'Logo Design',
    'Flyer / Poster',
    'Business Card',
    'Social Media Post',
    'Web & App Development',
    'Website (1-3 pages)',
    'Business Website (5 pages)',
    'E-Commerce Website',
    'Web Development (Hourly)',
    'Videography & Photography',
    'Video Editing & Photography',
    'Video Edit (1-3min)',
    'Promo / Advert',
    'Video Editing (Hourly)',
    'Basic Photoshoot (1hr)',
    'Matric Ball Photography',
    'Wedding Photography (Standard Half)',
    'Wedding Photography (Premium Half)',
    'Wedding Photography (Premium Full)',
    'Corporate Events',
    'Music Production & Mixing',
    'Studio Recording',
    'Beat Lease',
    'Beat Exclusive',
    'Mixing & Mastering',
    'Marketing & Promotions',
    'Event Coverage',
    'Technical Support',
    'Consultation (45min)',
    'Call-Out (Local)',
    'Starter Package',
    'Business Package',
    'Premium Package'
  ];

  function closeM(id) {
    document.getElementById(id).classList.remove('active');
  }

  function esc(str) {
    return String(str || '').replace(/"/g, '&quot;');
  }

  function toggleCard(bodyId, header) {
    const body = document.getElementById(bodyId);
    const indicator = header.querySelector('.collapse-indicator');

    if (body.style.display === 'none') {
      body.style.display = 'block';
      if (indicator) indicator.textContent = '▾';
    } else {
      body.style.display = 'none';
      if (indicator) indicator.textContent = '▸';
    }
  }

  function normServiceName(str) {
    return String(str || '')
      .toLowerCase()
      .replace(/&/g, 'and')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  function ensureInvoiceServices() {
    if (!DB.services) DB.services = [];

    let changed = false;

    DEFAULT_INVOICE_SERVICES.forEach(name => {
      const exists = DB.services.some(s => normServiceName(s.name) === normServiceName(name));

      if (!exists) {
        DB.services.push({
          id: nextId('SRV', 'services'),
          name,
          price: 0,
          type: 'project',
          category: 'General'
        });

        changed = true;
      }
    });

    if (changed) saveDB();
  }

  ensureInvoiceServices();

  function getServiceList() {
    const set = new Set(DEFAULT_INVOICE_SERVICES);

    (DB.services || []).forEach(s => {
      if (s.name) set.add(s.name);
    });

    (DB.projects || []).forEach(p => {
      if (p.service) set.add(p.service);
    });

    (DB.invoices || []).forEach(i => {
      const s = getInvoiceService(i);
      if (s) set.add(s);
    });

    return [...set].filter(s => s && s !== 'All Services').sort((a, b) => a.localeCompare(b));
  }

  function getInvoiceService(i) {
    if (i.service) return i.service;

    const p = getProject(i.projectId);
    if (p && p.service) return p.service;

    if (i.items && i.items.length && i.items[0].description) return i.items[0].description;

    return '';
  }

  function populateInvoiceFilters() {
    const clientSel = document.getElementById('filter-client');
    const projectSel = document.getElementById('filter-project');
    const serviceSel = document.getElementById('filter-service');
    const statusSel = document.getElementById('filter-status');

    const currentClient = clientSel.value;
    const currentProject = projectSel.value;
    const currentService = serviceSel.value;
    const currentStatus = statusSel.value;

    const clients = [...DB.clients].sort((a, b) => a.name.localeCompare(b.name));
    const projects = [...DB.projects].sort((a, b) => a.name.localeCompare(b.name));
    const services = getServiceList();

    clientSel.innerHTML = '<option value="">All Clients</option>' + clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    projectSel.innerHTML = '<option value="">All Projects</option>' + projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    serviceSel.innerHTML = '<option value="">All Services</option>' + services.map(s => `<option value="${esc(s)}">${s}</option>`).join('');

    if (currentClient) clientSel.value = currentClient;
    if (currentProject) projectSel.value = currentProject;
    if (currentService) serviceSel.value = currentService;
    if (currentStatus) statusSel.value = currentStatus;
  }

  function renderServiceChips() {
    const current = document.getElementById('filter-service').value;
    const services = getServiceList();
    const counts = {};

    DB.invoices.forEach(i => {
      const s = getInvoiceService(i);
      if (s) counts[s] = (counts[s] || 0) + 1;
    });

    let html = `<span class="service-chip ${current === '' ? 'active' : ''}" onclick="setServiceFilter('')">All</span>`;

    services.forEach(s => {
      html += `<span class="service-chip ${current === s ? 'active' : ''}" data-service="${esc(s)}" onclick="setServiceFilter(this.getAttribute('data-service'))">${s} (${counts[s] || 0})</span>`;
    });

    document.getElementById('service-chips').innerHTML = html;
  }

  function setServiceFilter(value) {
    document.getElementById('filter-service').value = value;
    renderInvoices();
  }

  function clearInvoiceFilters() {
    document.getElementById('inv-search').value = '';
    document.getElementById('filter-tracking').value = '';
    document.getElementById('filter-client').value = '';
    document.getElementById('filter-project').value = '';
    document.getElementById('filter-service').value = '';
    document.getElementById('filter-status').value = '';
    document.getElementById('invoice-sort').value = 'due-asc';
    renderInvoices();
  }

  function filtered() {
    const rawSearch = document.getElementById('inv-search').value || '';
    const q = rawSearch.toLowerCase().replace(/#/g, '').trim();
    const qCompact = q.replace(/\s+/g, '');

    const rawTrackingFilter = document.getElementById('filter-tracking').value || '';
    const trackingFilter = rawTrackingFilter.toLowerCase().replace(/#/g, '').trim().replace(/\s+/g, '');

    const clientFilter = document.getElementById('filter-client').value;
    const projectFilter = document.getElementById('filter-project').value;
    const serviceFilter = document.getElementById('filter-service').value;
    const statusFilter = document.getElementById('filter-status').value;

    let list = DB.invoices.filter(i => {
      const c = getClient(i.clientId);
      const p = getProject(i.projectId);
      const service = getInvoiceService(i);
      const itemText = (i.items || []).map(it => it.description || '').join(' ');

      const tracking = String(i.trackingNumber || '');
      const trackingNoHash = tracking.replace(/#/g, '').toLowerCase();
      const trackingDash = trackingNoHash.replace(/\//g, '-');
      const trackingDot = trackingNoHash.replace(/\//g, '.');
      const trackingCompact = trackingNoHash.replace(/\s+/g, '');

      const searchText = [
        trackingNoHash,
        trackingDash,
        trackingDot,
        tracking,
        c ? c.name : '',
        p ? p.name : '',
        service,
        i.status,
        itemText
      ].join(' ').toLowerCase();

      const searchCompact = searchText.replace(/\s+/g, '');

      const matchesSearch = !q || searchText.includes(q) || searchCompact.includes(qCompact);

      const matchesTracking = !trackingFilter || trackingCompact.includes(trackingFilter);

      const matchesClient = !clientFilter || i.clientId === clientFilter;
      const matchesProject = !projectFilter || i.projectId === projectFilter;
      const matchesService = !serviceFilter || service === serviceFilter;
      const matchesStatus = !statusFilter || i.status === statusFilter;

      return matchesSearch && matchesTracking && matchesClient && matchesProject && matchesService && matchesStatus;
    });

    const sort = document.getElementById('invoice-sort').value;

    list.sort((a, b) => {
      if (sort === 'due-asc') return (a.dueDate || '').localeCompare(b.dueDate || '');
      if (sort === 'due-desc') return (b.dueDate || '').localeCompare(a.dueDate || '');
      if (sort === 'issue-desc') return (b.issueDate || '').localeCompare(a.issueDate || '');
      if (sort === 'issue-asc') return (a.issueDate || '').localeCompare(b.issueDate || '');
      if (sort === 'total-desc') return Number(b.total || 0) - Number(a.total || 0);
      if (sort === 'total-asc') return Number(a.total || 0) - Number(b.total || 0);
      if (sort === 'outstanding-desc') return (Number(b.total || 0) - Number(b.paid || 0)) - (Number(a.total || 0) - Number(a.paid || 0));
      if (sort === 'client-asc') return getClientName(a.clientId).localeCompare(getClientName(b.clientId));
      if (sort === 'tracking-asc') return (a.trackingNumber || '').localeCompare(b.trackingNumber || '');
      return 0;
    });

    return list;
  }

  function getClientName(id) {
    const c = getClient(id);
    return c ? c.name : '';
  }

  function renderInvoices() {
    populateInvoiceFilters();

    const list = filtered();

    const tb = DB.invoices.reduce((s, i) => s + Number(i.total || 0), 0);
    const tp = DB.invoices.reduce((s, i) => s + Number(i.paid || 0), 0);

    document.getElementById('stat-billed').textContent = fmtZAR(tb);
    document.getElementById('stat-paid').textContent = fmtZAR(tp);
    document.getElementById('stat-due').textContent = fmtZAR(tb - tp);

    const bc = s => ({ paid: 'success', partial: 'warning', unpaid: 'danger', overdue: 'danger' }[s] || 'neutral');

    document.getElementById('invoices-table').innerHTML = list.map(i => {
      const c = getClient(i.clientId);

      return `<tr>
        <td><strong>#${i.trackingNumber}</strong></td>
        <td>${c ? c.name : '—'}</td>
        <td>${fmtDate(i.issueDate)}</td>
        <td>${fmtDate(i.dueDate)}</td>
        <td>${fmtZAR(i.total)}</td>
        <td><span class="badge badge-${bc(i.status)}">${i.status}</span></td>
        <td style="white-space:nowrap;">
          <button class="btn btn-secondary" onclick="viewInvoice('${i.id}')">View</button>
          ${i.status !== 'paid' ? `<button class="btn btn-success" onclick="markPaid('${i.id}')">Paid</button>` : ''}
          <button class="btn btn-danger" onclick="deleteInvoiceApi('${i.id}')">✕</button>
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:20px;">No matches.</td></tr>';

    const grouped = {};

    list.forEach(i => {
      (grouped[i.clientId] = grouped[i.clientId] || []).push(i);
    });

    document.getElementById('grouped-view').innerHTML = Object.entries(grouped).map(([cid, invs]) => {
      const c = getClient(cid);

      return `<div class="client-group">
        <div class="client-group-header">
          <h3 style="color:var(--text-primary);">
            <span class="badge badge-info">${c ? c.code : '—'}</span>
            ${c ? c.name : 'Unknown'}
            <span style="color:var(--text-muted);font-size:.8rem;">${invs.length} invoice(s) · ${fmtZAR(invs.reduce((s, i) => s + Number(i.total || 0), 0))}</span>
          </h3>
        </div>
        <div class="card" style="padding:0;margin:0;border:none;border-radius:0;">
          <table class="data-table">
            <tbody>
              ${invs.map(i => `<tr>
                <td><strong>#${i.trackingNumber}</strong></td>
                <td>${fmtDate(i.issueDate)}</td>
                <td>${fmtZAR(i.total)}</td>
                <td><span class="badge badge-${bc(i.status)}">${i.status}</span></td>
                <td><button class="btn btn-secondary" onclick="viewInvoice('${i.id}')">View</button></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }).join('') || '<p style="color:var(--text-muted);">No matches.</p>';

    renderServiceChips();
    feather.replace();
  }

  function setView(v) {
    currentView = v;

    document.getElementById('view-flat').className = 'btn ' + (v === 'flat' ? 'btn-primary' : 'btn-secondary');
    document.getElementById('view-grouped').className = 'btn ' + (v === 'grouped' ? 'btn-primary' : 'btn-secondary');

    document.getElementById('flat-view').style.display = v === 'flat' ? 'block' : 'none';
    document.getElementById('grouped-view').style.display = v === 'grouped' ? 'block' : 'none';
  }

  async function deleteInvoiceApi(id) {
    if (!confirm('Delete this invoice?')) return;
    try { await ApiService.deleteInvoice(Number(id)); DB.invoices = DB.invoices.filter(i => String(i.id) !== String(id)); renderInvoices(); }
    catch (error) { alert(error.message || 'Unable to delete invoice.'); }
  }

  function populateInvoiceModalSelects() {
    document.getElementById('invoice-client').innerHTML = '<option value="">Select...</option>' + DB.clients.map(c => `<option value="${c.id}">${c.name} (${c.code})</option>`).join('');
    document.getElementById('invoice-project').innerHTML = '<option value="">None</option>' + DB.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

    const services = [...DB.services].sort((a, b) => a.name.localeCompare(b.name));
    document.getElementById('service-pick').innerHTML = '<option value="">— Pick from catalog —</option>' + services.map(s => `<option value="${s.id}">${s.name} — ${fmtZAR(s.price)}</option>`).join('');
  }

  function makeUniqueClientCode(name) {
    let base = generateClientCode(name).toUpperCase();
    let code = base;
    let suffix = 1;

    while (DB.clients.some(c => c.code === code)) {
      code = base + suffix;
      suffix++;
    }

    return code;
  }

  async function createClientFromFields(firstName, surname, initials, phone, email, address) {
    const fullName = [firstName, surname].filter(Boolean).join(' ').trim();
    if (!fullName) return null;

    const existing = DB.clients.find(c => {
      const nameMatch = String(c.name || '').toLowerCase() === fullName.toLowerCase();
      const emailMatch = email && String(c.email || '').toLowerCase() === email.toLowerCase();
      const phoneMatch = phone && String(c.phone || '') === phone;

      return nameMatch && (emailMatch || phoneMatch || (!email && !phone));
    });

    if (existing) return existing.id;

    const client = {
      code: makeUniqueClientCode(fullName),
      name: fullName,
      firstName,
      surname,
      initials: initials || ((firstName && surname) ? (firstName[0] + surname[0]).toUpperCase() : fullName.slice(0, 2).toUpperCase()),
      phone,
      email,
      address,
      totalSpent: 0,
      projects: 0,
      status: 'active',
      clientId: 'CLT-' + Date.now()
    };

    const response = await ApiService.createClient(client);
    const savedClient = { ...(response.data || client), id: String(response.data?.id || nextId('CLT', 'clients')) };
    DB.clients.push(savedClient);
    populateInvoiceModalSelects();
    populateInvoiceFilters();

    return savedClient.id;
  }

  async function quickAddClient() {
    const firstName = document.getElementById('nc-first-name').value.trim();
    const surname = document.getElementById('nc-surname').value.trim();
    const initials = document.getElementById('nc-initials').value.trim();
    const phone = document.getElementById('nc-phone').value.trim();
    const email = document.getElementById('nc-email').value.trim();
    const address = document.getElementById('nc-address').value.trim();

    const clientId = await createClientFromFields(firstName, surname, initials, phone, email, address);

    if (!clientId) {
      alert('Client name is required.');
      return;
    }

    document.getElementById('invoice-client').value = clientId;

    document.getElementById('nc-first-name').value = '';
    document.getElementById('nc-surname').value = '';
    document.getElementById('nc-initials').value = '';
    document.getElementById('nc-phone').value = '';
    document.getElementById('nc-email').value = '';
    document.getElementById('nc-address').value = '';

    previewTracking();
  }

  function quickAddService() {
    const name = document.getElementById('new-service-name').value.trim();
    const price = parseFloat(document.getElementById('new-service-price').value) || 0;

    if (!name) {
      alert('Service name is required.');
      return;
    }

    const existing = DB.services.find(s => normServiceName(s.name) === normServiceName(name));

    if (!existing) {
      DB.services.push({
        id: nextId('SRV', 'services'),
        name,
        price,
        type: 'project',
        category: 'Custom'
      });

      saveDB();
    }

    populateInvoiceModalSelects();
    addItemRow(1, name, existing ? existing.price : price);

    document.getElementById('new-service-name').value = '';
    document.getElementById('new-service-price').value = '';
  }

  function addItemRow(qty = 1, desc = '', price = '') {
    const w = document.getElementById('items-rows');
    const d = document.createElement('div');

    d.className = 'item-row';
    d.innerHTML = `<input type="number" class="it-qty" min="1" value="${qty}" oninput="recalcItems()"><input class="it-desc" placeholder="Description" value="${esc(desc)}"><input type="number" class="it-price" step="0.01" value="${price}" oninput="recalcItems()"><span class="it-amt">R0.00</span><button type="button" class="btn btn-danger" onclick="this.parentElement.remove();recalcItems()">✕</button>`;

    w.appendChild(d);
    recalcItems();
  }

  function addFromService() {
    const s = DB.services.find(x => x.id === document.getElementById('service-pick').value);
    if (!s) return;

    addItemRow(1, s.name, s.price);
    document.getElementById('service-pick').value = '';
  }

  function readItems() {
    const items = [];

    document.querySelectorAll('#items-rows .item-row').forEach(rw => {
      const q = parseFloat(rw.querySelector('.it-qty').value) || 0;
      const d = rw.querySelector('.it-desc').value.trim();
      const p = parseFloat(rw.querySelector('.it-price').value) || 0;

      if (q > 0 && d) items.push({ qty: q, description: d, unitPrice: p });

      rw.querySelector('.it-amt').textContent = r(q * p);
    });

    return items;
  }

  function recalcItems() {
    const items = readItems();
    const sub = items.reduce((s, it) => s + it.qty * it.unitPrice, 0);
    const dp = parseFloat(document.getElementById('invoice-discount').value) || 0;
    const rate = parseFloat(document.getElementById('invoice-vat-rate').value) || 0;
    const disc = sub - sub * dp / 100;
    const vat = disc * rate / 100;

    document.getElementById('invoice-subtotal').value = r(sub);
    document.getElementById('invoice-vat').value = r(vat);
    document.getElementById('invoice-total').value = r(disc + vat);
  }

  function previewTracking() {
    const cid = document.getElementById('invoice-client').value;
    const iss = document.getElementById('invoice-issue').value;

    document.getElementById('tracking-preview').textContent = cid && iss ? '#' + generateTrackingNumber(cid, iss) : '#—';
  }

  function openInvoiceModal() {
    populateInvoiceModalSelects();

    document.getElementById('items-rows').innerHTML = '';
    document.getElementById('invoice-vat-rate').value = DB.settings.vatRate;
    document.getElementById('invoice-issue').valueAsDate = new Date();

    const d = new Date();
    d.setDate(d.getDate() + 30);
    document.getElementById('invoice-due').valueAsDate = d;

    document.getElementById('nc-first-name').value = '';
    document.getElementById('nc-surname').value = '';
    document.getElementById('nc-initials').value = '';
    document.getElementById('nc-phone').value = '';
    document.getElementById('nc-email').value = '';
    document.getElementById('nc-address').value = '';

    document.getElementById('new-service-name').value = '';
    document.getElementById('new-service-price').value = '';

    addItemRow();
    previewTracking();

    document.getElementById('invoice-modal').classList.add('active');
  }

  async function saveInvoice() {
    let clientId = document.getElementById('invoice-client').value;

    if (!clientId) {
      const firstName = document.getElementById('nc-first-name').value.trim();
      const surname = document.getElementById('nc-surname').value.trim();
      const initials = document.getElementById('nc-initials').value.trim();
      const phone = document.getElementById('nc-phone').value.trim();
      const email = document.getElementById('nc-email').value.trim();
      const address = document.getElementById('nc-address').value.trim();

      clientId = await createClientFromFields(firstName, surname, initials, phone, email, address);
    }

    const items = readItems();

    if (!clientId) {
      alert('Select or add a client');
      return;
    }

    if (!items.length) {
      alert('Add a line item');
      return;
    }

    const sub = items.reduce((s, it) => s + it.qty * it.unitPrice, 0);
    const dp = parseFloat(document.getElementById('invoice-discount').value) || 0;
    const rate = parseFloat(document.getElementById('invoice-vat-rate').value) || 0;
    const disc = sub - sub * dp / 100;
    const vat = disc * rate / 100;
    const iss = document.getElementById('invoice-issue').value;

    const projectId = document.getElementById('invoice-project').value || null;
    const project = getProject(projectId);
    const service = project && project.service ? project.service : (items[0] && items[0].description ? items[0].description : '');

    const inv = {
      trackingNumber: generateTrackingNumber(clientId, iss),
      clientId: Number(clientId),
      projectId: projectId ? Number(projectId) : null,
      service,
      items: JSON.stringify(items),
      subtotal: sub,
      discountPct: dp,
      vat,
      total: disc + vat,
      paid: 0,
      status: 'unpaid',
      issueDate: iss,
      dueDate: document.getElementById('invoice-due').value
    };

    try {
      const response = await ApiService.createInvoice(inv);
      const saved = response.data;
      DB.invoices.push({ ...saved, id: String(saved.id), clientId: String(saved.clientId), projectId: saved.projectId && String(saved.projectId), items: saved.items ? JSON.parse(saved.items) : items });
      closeM('invoice-modal');
      renderInvoices();
      setTimeout(() => viewInvoice(String(saved.id)), 250);
    } catch (error) { alert(error.message || 'Unable to create invoice.'); }
  }

  function markPaid(id) {
    const i = DB.invoices.find(x => x.id === id);
    if (!i) return;

    ApiService.markInvoicePaid(Number(id), Number(i.total) - Number(i.paid || 0)).then(response => {
      const saved = response.data || { ...i, paid: i.total, status: 'paid' };
      Object.assign(i, { ...saved, id: String(saved.id), clientId: String(saved.clientId), items: saved.items ? JSON.parse(saved.items) : i.items });
      renderInvoices();
    }).catch(error => alert(error.message || 'Unable to record payment.'));
  }

  function viewInvoice(id) {
    const i = DB.invoices.find(x => x.id === id);
    if (!i) return;

    const c = getClient(i.clientId);
    const items = (i.items && i.items.length) ? i.items : [{ qty: 1, description: 'Services', unitPrice: i.subtotal }];
    const dp = i.discountPct || 0;
    const qr = renderQR('CENTORO-INVOICE:' + i.trackingNumber + '|' + i.total + '|' + i.status);

    document.getElementById('invoice-paper').innerHTML = `<div class="ip-header"><div class="ip-brand"><h1>Centoro<span>.</span></h1><div style="color:#777;font-size:.75rem;font-style:italic;">Empowering Excellence. Defining Success.</div></div><div style="text-align:right;"><div class="ip-title">INVOICE</div><div><strong>Invoice# :</strong> ${i.trackingNumber}</div><div><strong>Invoice Date :</strong> ${fmtDateDMY(i.issueDate)}</div><div><strong>Due Date :</strong> ${fmtDateDMY(i.dueDate)}</div></div></div>
    <div class="ip-parties"><div><div class="ip-label">Client</div><strong>${c ? c.name : '—'}</strong>${c && c.address ? `<div>${c.address}</div>` : ''}</div><div><div class="ip-label">Service Provider</div><strong>${COMPANY.provider}</strong><div>${COMPANY.providerCity}</div></div></div>
    <table class="ip-table"><thead><tr><th>QTY</th><th>DESCRIPTION</th><th>UNIT PRICE</th><th>AMOUNT</th></tr></thead><tbody>${items.map(it => `<tr><td>${it.qty}</td><td>${it.description}</td><td>${r(it.unitPrice)}</td><td>${r(it.qty * it.unitPrice)}</td></tr>`).join('')}</tbody></table>
    <div class="ip-totals"><div class="ip-trow"><span>SUBTOTAL</span><span>${r(i.subtotal)}</span></div><div class="ip-trow"><span>${Number(dp).toFixed(2)}% DISCOUNT</span><span>${r(i.subtotal * dp / 100)}</span></div>${i.vat > 0 ? `<div class="ip-trow"><span>VAT</span><span>${r(i.vat)}</span></div>` : ''}<div class="ip-trow total"><span>TOTAL</span><span>${r(i.total)}</span></div></div>
    <div style="text-align:center;margin:14px 0;"><div style="font-size:.65rem;color:#999;text-transform:uppercase;">Scan to verify</div>${qr}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"><div class="ip-box"><h4>For More Information</h4><div><strong>${COMPANY.bank}</strong></div><div>Account Name : ${COMPANY.accountName}</div><div>Account No : ${COMPANY.accountNo}</div><div>Branch Code : ${COMPANY.branch}</div><div>Email : ${COMPANY.email1}</div><div>Email : ${COMPANY.email2}</div></div><div class="ip-box"><h4>Contact Us</h4><div>Contact : ${COMPANY.contact}</div><div>WhatsApp : ${COMPANY.contact}</div><h4 style="margin-top:8px;">Reg & Tax</h4><div>Reg.nr. : ${COMPANY.reg}</div><div>Tax Reg : ${COMPANY.tax}</div></div></div>
    <div class="ip-box"><h4>Centoro Services</h4><ul style="margin:0;padding-left:16px;">${COMPANY.services.map(s => `<li>${s}</li>`).join('')}</ul></div>
    <div class="ip-thanks">THANK YOU FOR MAKING USE OF OUR SERVICES!<div style="font-weight:400;font-style:italic;color:#777;">We wish you a blessed Day.</div></div>`;

    document.getElementById('invoice-view-modal').classList.add('active');
  }

  setView('grouped');
  async function loadInvoiceData() {
    try {
      const [invoices, clients, projects] = await Promise.all([ApiService.getInvoices(), ApiService.getClients(), ApiService.getProjects()]);
      DB.invoices = (invoices.data || []).map(i => ({ ...i, id: String(i.id), clientId: String(i.clientId), projectId: i.projectId && String(i.projectId), items: i.items ? JSON.parse(i.items) : [] }));
      DB.clients = (clients.data || []).map(c => ({ ...c, id: String(c.id) }));
      DB.projects = (projects.data || []).map(p => ({ ...p, id: String(p.id), clientId: String(p.clientId) }));
      renderInvoices();
    } catch (error) { console.error('Unable to load invoice data:', error); renderInvoices(); }
  }
  loadInvoiceData();
  feather.replace();
</script>
